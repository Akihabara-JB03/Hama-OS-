name: Build Hama OS

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install NASM and GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc make

    # 👈 Makefileを使わず、Actionsが直接あなたのソースコードをビルドします！
    - name: Compile and Link Hama OS
      run: |
        nasm -f elf32 boot.asm -o boot.o
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 kernel.c -o kernel.o
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 str.c -o str.o
        ld -m elf_i386 -T linker.ld boot.o kernel.o str.o -o os.img

    - name: Upload Hama OS Image
      uses: actions/upload-artifact@v4
      with:
        name: HamaOS-Disk-Image
        path: os.img
