name: Build Hama OS Installer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install NASM and GCC
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends nasm gcc

    - name: Compile and Link Installer Image
      run: |
        # 1. 💡 新しいインストーラー専用アセンブラ（boot_installer.asm）をビルド！
        nasm -f bin boot_installer.asm -o boot_installer.bin
        
        # 2. 共通のC言語ソースファイルをコンパイル
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 str.c -o str.o
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 io.c -o io.o
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 keyboard.c -o keyboard.o

        # 3. インストーラー用のメイン処理をコンパイル
        gcc -m32 -c -fno-pie -fno-stack-protector -nostdlib -fno-builtin -O2 installer.c -o installer.o
        
        # 4. 結合してインスローラ用のカーネルバイナリを作成
        ld -m elf_i386 -Ttext 0x7E00 --oformat binary installer.o str.o io.o keyboard.o -o installer.bin
        
        # 5. 💡 インストーラー用のパーツ同士を合体させてイメージ化
        cat boot_installer.bin installer.bin > installer.img
        truncate -s 10240 installer.img

    # 6. 配布用の installer.img のみを Artifact としてアップロード
    - name: Upload Hama OS Installer Image
      uses: actions/upload-artifact@v4
      with:
        name: HamaOS-Installer-Image
        path: installer.img
